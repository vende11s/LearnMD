name: Verify and deploy LearnMD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SHARE_API_URL: ${{ vars.VITE_SHARE_API_URL || 'https://learnmd-sharing.wierzbinski9.workers.dev' }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || '0x4AAAAAAFV584jGr4TxXSOx' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - run: npm --prefix worker run typecheck
      - run: npm run test:worker
      - run: npm --prefix worker run deploy:dry-run
      - run: npm run skill:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - run: npm run test:sharing
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
